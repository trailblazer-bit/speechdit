defaults:
  - base
  - _self_

project: v2s_tts_pretrain_wostyle
resume_weights_only: false

# Lightning Trainer
trainer:
  accelerator: gpu
  devices: auto
  strategy: ddp_find_unused_parameters_true
  precision: 32
  max_steps: 2_000_000
  val_check_interval: 1000
  benchmark: false

sample_rate: 22050
hop_length: 256
num_mels: 80
n_fft: 1024
win_length: 1024
audio_vocab_size: 500


# Dataset Configuration
train_dataset:
  _target_: fish_speech.datasets.v2s_tts_dataset_combine.FlowTokenDecoderDataset
  sample_rate: ${sample_rate}
  hop_length: ${hop_length}
  data_json: data/mls_en_witext/train_data.json


val_dataset:
  _target_: fish_speech.datasets.v2s_tts_dataset_combine.FlowTokenDecoderDataset
  sample_rate: ${sample_rate}
  hop_length: ${hop_length}
  data_json: data/mls_en_witext/valid_data.json

data:
  _target_: fish_speech.datasets.v2s_tts_dataset_combine.FlowTokenDecoderDataModule
  train_dataset: ${train_dataset}
  val_dataset: ${val_dataset}
  num_workers: 8
  batch_size: 8
  val_batch_size: 8
  max_tokens: 4800
  audio_pad_token: ${audio_vocab_size}

# Model Configuration
model:
  _target_: fish_speech.models.v2s_tts.V2S_TTS_Pretrain
  sample_rate: ${sample_rate}
  hop_length: ${hop_length}

  generator:
    _target_: fish_speech.models.v2s_tts.pretrain_model.V2S_TTS_Pretrain_Model_Wo_SBank
    input_size: 512
    output_size: 80
    output_type: 'mel'
    vocab_size: ${audio_vocab_size}
    spk_dim: 192
    sll_checkpoint: checkpoints/wavlm_large.pt
    output_layer: 6

    decoder: 
      _target_: fish_speech.models.v2s_tts.flow_matching_dit.ConditionalCFM
      in_channels: 160
      n_spks: 0
      spk_emb_dim: 80
      cfm_params: 
        _target_: omegaconf.DictConfig
        content:
          sigma_min: 1e-06
          solver: 'euler'
          t_scheduler: 'cosine'
          training_cfg_rate: 0.2
          inference_cfg_rate: 0.7
          reg_loss_type: 'l1'
      estimator: 
        _target_: fish_speech.models.v2s_tts.model.backbones.dit.DiT_WoStyle
        dim: 1024
        depth: 22
        heads: 16
        ff_mult: 2
        conv_layers: 4
        mel_dim: 80
        style_dim: 256

    encoder:
      _target_: fish_speech.models.v2s_tts.transformer.encoder.ConformerEncoder
      output_size: 512
      attention_heads: 8
      linear_units: 2048
      num_blocks: 6
      dropout_rate: 0.1
      positional_dropout_rate: 0.1
      attention_dropout_rate: 0.1
      normalize_before: True
      input_layer: 'linear'
      pos_enc_layer_type: 'rel_pos_espnet'
      selfattention_layer_type: 'rel_selfattn'
      input_size: 512
      use_cnn_module: False
      macaron_style: False 

  
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1e-4
    betas: [0.8, 0.99]
    eps: 1e-6

  lr_scheduler:
    _target_: transformers.get_cosine_schedule_with_warmup
    _partial_: true
    num_warmup_steps: 1000
    num_training_steps: 2000000

callbacks:
  grad_norm_monitor:
    sub_module: 
      - generator

  model_checkpoint:
    every_n_train_steps: 1000
    save_top_k: 100